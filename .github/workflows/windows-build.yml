name: Windows Build
on:
  push:
    branches: [ main, build/full-foundation ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  test-build-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore app
        run: dotnet restore src/ToneCustoms.ShellStudio/ToneCustoms.ShellStudio.csproj
      - name: Restore tests
        run: dotnet restore tests/ToneCustoms.ShellStudio.Tests/ToneCustoms.ShellStudio.Tests.csproj
      - name: Test
        run: dotnet test tests/ToneCustoms.ShellStudio.Tests/ToneCustoms.ShellStudio.Tests.csproj -c Release --no-restore
      - name: Publish self-contained EXE
        run: dotnet publish src/ToneCustoms.ShellStudio/ToneCustoms.ShellStudio.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: ToneCustoms-Shell-Studio-Windows
          path: publish/
